# Jarvis — copy this to config.toml and edit as you like.

[user]
name            = "Raul"
address         = "sir"           # how Jarvis addresses you. Try "sir",
                                  # "madam", "boss", or "" to disable.
greeting_style  = "morning"       # placeholder for future personalization

[voice]
enabled    = true
engine     = "auto"               # "auto" (edge → sapi) | "edge" | "sapi"
voice_name = "en-US-JennyNeural"  # neural voice for edge-tts. Some options:
                                  #   en-US-JennyNeural     warm female (default)
                                  #   en-US-AriaNeural      crisp female, news-anchor
                                  #   en-US-MichelleNeural  younger female
                                  #   en-GB-SoniaNeural     female UK
                                  #   es-ES-ElviraNeural    female Spain
                                  #   es-MX-DaliaNeural     female Mexico
                                  #   fr-FR-DeniseNeural    female France
                                  # Full list: `edge-tts --list-voices`
rate       = 180                  # words per minute (140-220 is comfortable)
volume     = 0.9                  # 0.0 - 1.0

[startup]
open_spotify = true
open_google  = true
extra_urls   = []                 # e.g. ["https://calendar.google.com"]

[wake]
enabled = false                   # set true to always run in wake-word mode
phrases = ["hey jarvis", "jarvis"]
ack     = "Yes?"                  # what Jarvis says when it hears you

[resolver]
# Extra folders the `open`, `read`, and `find` commands should search on
# top of the defaults (Desktop, Documents, Downloads, Start Menu, plus
# any OneDrive equivalents). Add project vaults, code roots, mounted
# drives, etc.
extra_roots = [
  # "C:/Users/you/projects",
  # "D:/vault",
]
# Hard cap for `read <file>`. Anything past this is truncated with a
# clear marker. 200 KB is comfortable for logs / CSVs / source files.
read_max_bytes = 200000

[llm]
# When enabled, requests that don't match the built-in regex intents are
# forwarded to Gemini. Gemini either returns a canonical Jarvis command
# ("pon música" -> "play music") or a short spoken answer.
#
# Get a free API key at https://aistudio.google.com/app/apikey, or set the
# GEMINI_API_KEY environment variable instead of putting it here.
enabled         = false
api_key         = ""                  # or leave empty + set GEMINI_API_KEY
model           = "gemini-3.6-flash"
temperature     = 0.3
timeout_seconds = 6.0
history_size    = 5                   # exchanges kept for context ("and tomorrow?")

[stt]
# Speech-to-text tuning. Bump `energy_threshold` if Jarvis is picking up
# ambient noise; lower it if it's ignoring you. Add / reorder
# `alt_languages` if you mix in Spanish or French mid-sentence.
language                    = "en-US"
alt_languages               = ["es-ES", "fr-FR"]
energy_threshold            = 300     # min energy floor (higher = less sensitive)
pause_threshold             = 0.7     # seconds of silence that end a phrase
phrase_time_limit           = 6.0     # max seconds for the wake utterance
followup_time_limit         = 10.0    # max seconds for each follow-up command
conversation_timeout        = 12.0    # silence before we exit conversation mode
fuzzy_threshold             = 0.78    # 0..1. Lower = more forgiving wake match
recalibrate_every_seconds   = 300.0   # periodic ambient noise recalibration
# mic_index                = 2       # pin a specific input device (default: system)
# List devices:
#   python -c "import speech_recognition as sr; print(list(enumerate(sr.Microphone.list_microphone_names())))"

[news]
limit = 5                         # how many headlines to fetch per call

[soccer]
favorite_league = "la liga"       # default when you say just "scores"
                                  # options: la liga, premier, champions,
                                  #          serie a, bundesliga, ligue 1,
                                  #          mls, peru, libertadores, europa

[pomodoro]
work_minutes = 25                 # `pomodoro` command starts a focus block

[apps]
# Friendly name → what to launch. Edit paths per your machine.
spotify    = "spotify"
chrome     = "chrome"
edge       = "msedge"
code       = "code"
notepad    = "notepad"
calculator = "calc"
terminal   = "wt"
